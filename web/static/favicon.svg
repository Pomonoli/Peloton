<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <style>
    :root { --tile: #e9eeff; --bicycle: #4263eb; }
    @media (prefers-color-scheme: dark) {
      :root { --tile: #202c50; --bicycle: #7394ff; }
    }
    #light { --tile: #e9eeff; --bicycle: #4263eb; }
    #dark { --tile: #202c50; --bicycle: #7394ff; }
    .forced { display: none; }
    .forced:target { display: inline; }
    .forced:target ~ .automatic { display: none; }
  </style>
  <defs>
    <g id="peloton-mark">
      <rect x="1" y="1" width="38" height="38" rx="10" fill="var(--tile)" />
      <g fill="none" stroke="var(--bicycle)" stroke-width="2.35" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="10" cy="26" r="5.5" />
        <circle cx="30" cy="26" r="5.5" />
        <path d="M10 26l4.8-10.6h10.4l-6.4 10.6H10m8.8 0-5.4-13.2m-2.7 0h5.5m13.8 13.2-6.1-14.9h4.5a2 2 0 0 1 0 4" />
      </g>
    </g>
  </defs>
  <use id="light" class="forced" href="#peloton-mark" />
  <use id="dark" class="forced" href="#peloton-mark" />
  <use class="automatic" href="#peloton-mark" />
</svg>
